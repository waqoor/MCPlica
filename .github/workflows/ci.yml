name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:18.6@sha256:4ef4dbc939d61acea57712655ddb4b4ab27419c913f94cca0cd57cb3ea3c2280
        env:
          POSTGRES_DB: mcplica_test
          POSTGRES_USER: mcplica_test
          POSTGRES_PASSWORD: integration-postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mcplica_test -d mcplica_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql+psycopg://mcplica_test:integration-postgres@127.0.0.1:5432/mcplica_test
      TEST_DATABASE_URL: postgresql+psycopg://mcplica_test:integration-postgres@127.0.0.1:5432/mcplica_test
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Verify release version and repository documentation
        working-directory: .
        run: |
          python scripts/release_version.py --check
          python scripts/github_labels.py --check
          python scripts/validate_docs.py
          python scripts/validate_starter.py
      - name: Verify tracked source checksum manifest
        working-directory: .
        run: python scripts/checksum_manifest.py --check
      - name: Archive the exact tracked source for reproducible verification
        working-directory: .
        run: git archive --format=tar.gz --output="$RUNNER_TEMP/mcplica-source.tar.gz" HEAD
      - name: Preserve verification source snapshot
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: verification-source
          path: ${{ runner.temp }}/mcplica-source.tar.gz
          retention-days: 1
          if-no-files-found: error
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: "3.13"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: uv sync --frozen --extra dev
      - run: uv run --frozen --extra dev ruff check app tests scripts ../packages/contracts/src ../packages/contracts/tests ../packages/contracts/scripts ../scripts ../tests/integration ../migrations
      - run: uv run --frozen --extra dev ruff format --check app tests scripts ../packages/contracts/src ../packages/contracts/tests ../packages/contracts/scripts ../scripts ../tests/integration ../migrations
      - run: uv run --frozen --extra dev pyright app ../packages/contracts/src
      - run: uv run --frozen --extra dev alembic -c ../migrations/alembic.ini upgrade head
      - run: uv run --frozen --extra dev python generate_openapi.py --check
      - run: uv run --frozen --extra dev pytest -c pyproject.toml tests ../packages/contracts/tests ../tests/integration/test_fixture_server.py --cov=app --cov-report=json:coverage-critical.json
      - run: uv run --frozen --extra dev python scripts/check_critical_coverage.py coverage-critical.json
      - run: uv run --frozen --extra dev alembic -c ../migrations/alembic.ini check

  runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: mcp_runtime
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: "3.13"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: uv sync --frozen --extra dev
      - run: uv run --frozen --extra dev ruff check app tests
      - run: uv run --frozen --extra dev ruff format --check app tests
      - run: uv run --frozen --extra dev pyright app
      - run: uv run --frozen --extra dev pytest

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test:run
      - run: pnpm check:api
      - run: pnpm check:assets
      - run: pnpm build

  e2e:
    needs: frontend
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium firefox webkit
      - run: pnpm test:e2e

  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Review introduced dependencies on supported public repositories
        if: github.event.repository.private == false
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
      - name: Audit the locked frontend dependency graph
        if: github.event.repository.private
        run: >-
          docker run --rm
          --volume "${{ github.workspace }}:/src:ro"
          ghcr.io/google/osv-scanner:v2.4.0@sha256:5116601dedc01c1c580eb92371883ec052fc4c13c3fbc109d621a63ac416d475
          scan source
          --lockfile /src/frontend/pnpm-lock.yaml
          --format vertical
          --verbosity info
      - name: Set up uv for the private-repository dependency audit
        if: github.event.repository.private
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: "3.13"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Audit the locked Python dependency graph
        if: github.event.repository.private
        run: |
          uv export --frozen --all-packages --all-extras --no-emit-workspace --output-file "$RUNNER_TEMP/mcplica-requirements.txt"
          uvx pip-audit --requirement "$RUNNER_TEMP/mcplica-requirements.txt"

  docker:
    needs: [backend, runtime, frontend, e2e]
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      RUN_DOCKER_INTEGRATION: "1"
      TEST_RUNTIME_IMAGE: mcplica/runtime:test
      TEST_RUNTIME_PULL_POLICY: never
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set runner-local test paths
        run: |
          printf 'TEST_RUNTIME_WORKER_ROOT=%s/dynamic-runtime-test\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
          printf 'TEST_RUNTIME_HOST_ROOT=%s/dynamic-runtime-test\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: "3.13"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - run: uv sync --project backend --frozen --extra dev
      - name: Prepare disposable configuration (never uses production secrets)
        run: python tests/integration/prepare_compose.py
      - name: Validate canonical Compose configuration
        run: docker compose --env-file .env -f infra/compose.yaml config --quiet
      - name: Validate resolved production settings without production credentials
        env:
          PYTHONPATH: backend
        run: uv run --project backend --frozen --extra dev python tests/integration/production_config_check.py
      - name: Verify Docker excludes private runtime and environment files
        run: python tests/integration/docker_context_check.py
      - name: Build canonical application images
        run: docker compose --env-file .env -f infra/compose.yaml build api runtime-validator frontend
      - name: Verify image versions, OCI metadata, and runtime users
        run: python tests/integration/image_metadata_check.py
      - name: Scan backend candidate image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: mcplica/backend:test
          version: v0.74.0
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
      - name: Scan runtime candidate image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: mcplica/runtime:test
          version: v0.74.0
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
      - name: Scan frontend candidate image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: mcplica/frontend:test
          version: v0.74.0
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
      - name: Start the complete platform, including schema and mount initialization
        run: docker compose --env-file .env -f infra/compose.yaml up --no-build --detach --wait --wait-timeout 300
      - name: Check every required service and one-shot initialization
        run: python tests/integration/compose_evidence.py --check
      - name: Initialize the disposable development administrator
        run: docker compose --env-file .env -f infra/compose.yaml exec -T api python -m app.cli.ensure_development_admin
      - name: Exercise source, build, MCP calls, outage recovery, redeployment, and rollback
        env:
          PYTHONPATH: backend:tests/integration
        run: >-
          uv run --project backend --frozen --extra dev python
          tests/integration/full_stack_workflow.py
          --api-base http://127.0.0.1:8080/api/v1
          --report output/compose-validation/workflow.json
      - name: Verify real Milvus project and generation isolation
        run: >-
          docker compose --env-file .env -f infra/compose.yaml
          exec -T -e RUN_DOCKER_INTEGRATION=1 builder-worker python
          < tests/integration/vector_isolation_check.py
      - name: Exercise real isolated runtime replacement
        run: >-
          uv run --project backend --frozen --extra dev pytest
          backend/tests/integration/test_dynamic_runtime_docker.py -q
      - name: Exercise the actual Compose browser UI
        working-directory: frontend
        env:
          E2E_LIVE: "1"
          E2E_BASE_URL: http://127.0.0.1:8080
        run: |
          corepack enable
          pnpm install --frozen-lockfile
          pnpm exec playwright install --with-deps chromium
          PYTHONPATH=../tests/integration uv run --project ../backend --frozen --extra dev \
            python -m uvicorn mock_openrouter.app:app \
            --host 0.0.0.0 --port 9010 \
            > "$RUNNER_TEMP/openrouter-browser-fixture.log" 2>&1 &
          fixture_pid=$!
          cleanup_fixture() {
            kill "$fixture_pid" 2>/dev/null || true
            wait "$fixture_pid" 2>/dev/null || true
          }
          trap cleanup_fixture EXIT
          for _ in $(seq 1 100); do
            if ! kill -0 "$fixture_pid" 2>/dev/null; then
              cat "$RUNNER_TEMP/openrouter-browser-fixture.log"
              exit 1
            fi
            if curl --fail --silent --show-error http://127.0.0.1:9010/healthz \
              | grep --fixed-strings --quiet '"service":"mock-openrouter"'; then
              break
            fi
            sleep 0.1
          done
          curl --fail --silent --show-error http://127.0.0.1:9010/healthz \
            | grep --fixed-strings --quiet '"service":"mock-openrouter"'
          pnpm exec playwright test e2e/live-stack.spec.ts --project=chromium
      - name: Verify service recovery after all acceptance checks
        run: python tests/integration/compose_evidence.py --check
      - name: Collect bounded redacted diagnostics
        if: always()
        run: python tests/integration/compose_evidence.py
      - name: Upload Compose validation evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: compose-validation
          path: output/compose-validation/
          if-no-files-found: warn
          retention-days: 7
      - name: Remove resources in the disposable runner
        if: always()
        run: |
          docker ps -aq --filter label=com.mcplica.managed=true | xargs -r docker rm -f
          docker compose --env-file .env -f infra/compose.yaml down --volumes --remove-orphans
