name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.6@sha256:1957b2ff3137e4ef7f3bc813e74fff50b1e1ffddc85c8b9d6f14ade972be8687
        env:
          POSTGRES_DB: mcplica_test
          POSTGRES_USER: mcplica_test
          POSTGRES_PASSWORD: integration-postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mcplica_test -d mcplica_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql+psycopg://mcplica_test:integration-postgres@127.0.0.1:5432/mcplica_test
      TEST_DATABASE_URL: postgresql+psycopg://mcplica_test:integration-postgres@127.0.0.1:5432/mcplica_test
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          python-version: "3.13"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: uv sync --frozen --extra dev
      - run: uv run --frozen --extra dev ruff check app tests ../packages/contracts/src ../packages/contracts/tests
      - run: uv run --frozen --extra dev ruff format --check app tests ../packages/contracts/src ../packages/contracts/tests
      - run: uv run --frozen --extra dev pyright app ../packages/contracts/src
      - run: uv run --frozen --extra dev alembic -c ../migrations/alembic.ini upgrade head
      - run: uv run --frozen --extra dev pytest -c pyproject.toml tests ../packages/contracts/tests --cov=app --cov-report=json:coverage-critical.json
      - run: uv run --frozen --extra dev python scripts/check_critical_coverage.py coverage-critical.json
      - run: uv run --frozen --extra dev alembic -c ../migrations/alembic.ini check

  runtime:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mcp_runtime
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          python-version: "3.13"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: uv sync --frozen --extra dev
      - run: uv run --frozen --extra dev ruff check app tests
      - run: uv run --frozen --extra dev ruff format --check app tests
      - run: uv run --frozen --extra dev pyright app
      - run: uv run --frozen --extra dev pytest

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test:run
      - run: pnpm check:api
      - run: pnpm check:assets
      - run: pnpm build

  e2e:
    needs: frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium firefox webkit
      - run: pnpm test:e2e
      - name: Upload browser diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: |
            frontend/playwright-report
            frontend/test-results
          if-no-files-found: ignore
          retention-days: 14

  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high

  docker:
    needs: [backend, runtime, frontend, e2e]
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.6@sha256:1957b2ff3137e4ef7f3bc813e74fff50b1e1ffddc85c8b9d6f14ade972be8687
        env:
          POSTGRES_DB: mcplica
          POSTGRES_USER: mcplica
          POSTGRES_PASSWORD: integration-postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mcplica -d mcplica"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql+psycopg://mcplica:integration-postgres@127.0.0.1:5432/mcplica
      POSTGRES_PASSWORD: compose-postgres
      MINIO_ROOT_USER: compose-minio
      MINIO_ROOT_PASSWORD: compose-minio-password
      RUNTIME_HOST_ROOT: ${{ runner.temp }}/mcplica-runtime
      RUN_DOCKER_INTEGRATION: "1"
      TEST_RUNTIME_IMAGE: mcplica/runtime:test
      TEST_RUNTIME_PULL_POLICY: never
      TEST_RUNTIME_WORKER_ROOT: ${{ runner.temp }}/mcplica-runtime
      TEST_RUNTIME_HOST_ROOT: ${{ runner.temp }}/mcplica-runtime
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          python-version: "3.13"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: uv sync --project backend --frozen --extra dev
      - name: Upgrade an empty PostgreSQL database to the migration head
        working-directory: migrations
        run: uv run --project ../backend --frozen --extra dev alembic -c alembic.ini upgrade head
      - run: docker build --file infra/docker/backend.Dockerfile --tag mcplica/backend:test .
      - run: docker build --file infra/docker/runtime.Dockerfile --tag mcplica/runtime:test .
      - run: docker build --file infra/docker/frontend.Dockerfile --tag mcplica/frontend:test .
      - name: Start the labeled edge provider
        run: |
          mkdir -p "${RUNTIME_HOST_ROOT}"
          docker compose --env-file .env.example -f infra/compose.yaml up -d traefik
      - name: Exercise isolated runtime replacement and rollback
        run: >-
          uv run --project backend --frozen --extra dev pytest
          backend/tests/integration/test_dynamic_runtime_docker.py -q
      - name: Remove runtime acceptance resources
        if: always()
        run: docker compose --env-file .env.example -f infra/compose.yaml down --remove-orphans
