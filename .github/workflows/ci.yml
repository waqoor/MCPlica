name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:18.6@sha256:1957b2ff3137e4ef7f3bc813e74fff50b1e1ffddc85c8b9d6f14ade972be8687
        env:
          POSTGRES_DB: mcplica_test
          POSTGRES_USER: mcplica_test
          POSTGRES_PASSWORD: integration-postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mcplica_test -d mcplica_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql+psycopg://mcplica_test:integration-postgres@127.0.0.1:5432/mcplica_test
      TEST_DATABASE_URL: postgresql+psycopg://mcplica_test:integration-postgres@127.0.0.1:5432/mcplica_test
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Archive the exact tracked source for reproducible verification
        working-directory: .
        run: git archive --format=tar.gz --output="$RUNNER_TEMP/mcplica-source.tar.gz" HEAD
      - name: Preserve verification source snapshot
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: verification-source
          path: ${{ runner.temp }}/mcplica-source.tar.gz
          retention-days: 1
          if-no-files-found: error
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          python-version: "3.13"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: uv sync --frozen --extra dev
      - run: uv run --frozen --extra dev ruff check app tests ../packages/contracts/src ../packages/contracts/tests
      - run: uv run --frozen --extra dev ruff format --check app tests ../packages/contracts/src ../packages/contracts/tests
      - run: uv run --frozen --extra dev pyright app ../packages/contracts/src
      - run: uv run --frozen --extra dev alembic -c ../migrations/alembic.ini upgrade head
      - run: uv run --frozen --extra dev pytest -c pyproject.toml tests ../packages/contracts/tests ../tests/integration/test_fixture_server.py --cov=app --cov-report=json:coverage-critical.json
      - run: uv run --frozen --extra dev python scripts/check_critical_coverage.py coverage-critical.json
      - run: uv run --frozen --extra dev alembic -c ../migrations/alembic.ini check

  runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: mcp_runtime
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          python-version: "3.13"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: uv sync --frozen --extra dev
      - run: uv run --frozen --extra dev ruff check app tests
      - run: uv run --frozen --extra dev ruff format --check app tests
      - run: uv run --frozen --extra dev pyright app
      - run: uv run --frozen --extra dev pytest

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test:run
      - run: pnpm check:api
      - run: pnpm check:assets
      - run: pnpm build

  e2e:
    needs: frontend
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium firefox webkit
      - run: pnpm test:e2e
      - name: Upload browser diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: |
            frontend/playwright-report
            frontend/test-results
          if-no-files-found: ignore
          retention-days: 14

  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high

  docker:
    needs: [backend, runtime, frontend, e2e]
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      RUN_DOCKER_INTEGRATION: "1"
      TEST_RUNTIME_IMAGE: mcplica/runtime:test
      TEST_RUNTIME_PULL_POLICY: never
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Set runner-local test paths
        run: |
          printf 'TEST_RUNTIME_WORKER_ROOT=%s/dynamic-runtime-test\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
          printf 'TEST_RUNTIME_HOST_ROOT=%s/dynamic-runtime-test\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          python-version: "3.13"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - run: uv sync --project backend --frozen --extra dev
      - name: Prepare disposable configuration (never uses production secrets)
        run: python tests/integration/prepare_compose.py
      - name: Validate canonical Compose configuration
        run: docker compose --env-file .env -f infra/compose.yaml config --quiet
      - name: Validate production override without using live production credentials
        env:
          BACKEND_IMAGE: mcplica/backend@sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
          FRONTEND_IMAGE: mcplica/frontend@sha256:bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb
          MCP_RUNTIME_IMAGE: mcplica/runtime@sha256:cccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccc
          UI_DOMAIN: ui.example.com
          API_DOMAIN: api.example.com
          MCP_DOMAIN: mcp.example.com
          ACME_EMAIL: operator@example.com
        run: docker compose --env-file .env -f infra/compose.yaml -f infra/compose.production.yaml config --quiet
      - name: Build canonical application images
        run: docker compose --env-file .env -f infra/compose.yaml build api runtime-validator frontend
      - name: Start the complete platform, including schema and mount initialization
        run: docker compose --env-file .env -f infra/compose.yaml up --no-build --detach --wait --wait-timeout 300
      - name: Check every required service and one-shot initialization
        run: python tests/integration/compose_evidence.py --check
      - name: Initialize the disposable development administrator
        run: docker compose --env-file .env -f infra/compose.yaml exec -T api python -m app.cli.ensure_development_admin
      - name: Exercise source, build, MCP calls, outage recovery, redeployment, and rollback
        env:
          PYTHONPATH: backend:tests/integration
        run: >-
          uv run --project backend --frozen --extra dev python
          tests/integration/full_stack_workflow.py
          --api-base http://127.0.0.1:8080/api/v1
          --report output/compose-validation/workflow.json
      - name: Exercise real isolated runtime replacement
        run: >-
          uv run --project backend --frozen --extra dev pytest
          backend/tests/integration/test_dynamic_runtime_docker.py -q
      - name: Exercise the actual Compose browser UI
        working-directory: frontend
        env:
          E2E_LIVE: "1"
          E2E_BASE_URL: http://127.0.0.1:8080
        run: |
          corepack enable
          pnpm install --frozen-lockfile
          pnpm exec playwright install --with-deps chromium
          pnpm exec playwright test e2e/live-stack.spec.ts --project=chromium
      - name: Verify service recovery after all acceptance checks
        run: python tests/integration/compose_evidence.py --check
      - name: Collect bounded redacted diagnostics
        if: always()
        run: python tests/integration/compose_evidence.py
      - name: Upload Compose validation evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: compose-validation
          path: |
            output/compose-validation/
            frontend/playwright-report/
          if-no-files-found: warn
          retention-days: 7
      - name: Remove resources in the disposable runner
        if: always()
        run: |
          docker ps -aq --filter label=com.mcplica.managed=true | xargs -r docker rm -f
          docker compose --env-file .env -f infra/compose.yaml down --volumes --remove-orphans
