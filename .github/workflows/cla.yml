name: CLA

on:
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  checks: read
  contents: read
  pull-requests: read
  statuses: read

jobs:
  policy:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      CLA_STATUS_CONTEXT: ${{ vars.CLA_STATUS_CONTEXT }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      AUTHOR_ASSOCIATION: ${{ github.event.pull_request.author_association }}
      AUTHOR_LOGIN: ${{ github.event.pull_request.user.login }}
    steps:
      - name: Verify contributor authorization
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${AUTHOR_LOGIN}" == "dependabot[bot]" ]]; then
            echo "Dependabot is repository automation; no contributor CLA is required."
            exit 0
          fi

          case "${AUTHOR_ASSOCIATION}" in
            OWNER|MEMBER|COLLABORATOR)
              echo "Trusted repository contributor (${AUTHOR_ASSOCIATION}); authorization is inherent in repository access."
              exit 0
              ;;
          esac

          if [[ -z "${CLA_STATUS_CONTEXT}" ]]; then
            echo "::error::External contributor CLA verification is unavailable: configure the CLA_STATUS_CONTEXT repository variable."
            exit 2
          fi

          status_state="$({ gh api \
            "repos/${GITHUB_REPOSITORY}/commits/${HEAD_SHA}/status" \
            --jq '.statuses | map(select(.context == env.CLA_STATUS_CONTEXT)) | first | .state // "missing"'; } 2>/dev/null || echo unavailable)"
          check_conclusion="$({ gh api \
            -H 'Accept: application/vnd.github+json' \
            "repos/${GITHUB_REPOSITORY}/commits/${HEAD_SHA}/check-runs" \
            --jq '.check_runs | map(select(.name == env.CLA_STATUS_CONTEXT)) | first | (.conclusion // .status) // "missing"'; } 2>/dev/null || echo unavailable)"

          if [[ "${status_state}" == "success" || "${check_conclusion}" == "success" ]]; then
            echo "Configured CLA verification succeeded."
            exit 0
          fi
          if [[ "${status_state}" == "unavailable" && "${check_conclusion}" == "unavailable" ]]; then
            echo "::error::CLA verification service status could not be queried."
            exit 2
          fi
          echo "::error::CLA verification is not successful (status=${status_state}, check=${check_conclusion})."
          exit 1
