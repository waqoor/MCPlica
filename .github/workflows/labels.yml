name: Repository labels

on:
  push:
    branches: [master]
    paths:
      - .github/labels.json
      - .github/ISSUE_TEMPLATE/**
      - scripts/github_labels.py
      - .github/workflows/labels.yml
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  synchronize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Apply managed labels without deleting repository-specific labels
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/github_labels.py --apply
