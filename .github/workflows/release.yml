name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  actions: read
  attestations: write
  contents: write
  id-token: write
  packages: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify immutable release identity
        id: version
        shell: bash
        run: |
          python scripts/release_version.py --check --tag "${GITHUB_REF_NAME}"
          version="$(python scripts/release_version.py --print)"
          test "$(git cat-file -t "refs/tags/${GITHUB_REF_NAME}")" = tag
          git fetch --no-tags origin master
          git merge-base --is-ancestor "${GITHUB_SHA}" origin/master
          printf 'version=%s\n' "${version}" >> "${GITHUB_OUTPUT}"
      - name: Require successful pre-publication workflows for this commit
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          for workflow in ci.yml security.yml; do
            count="$(gh api "/repos/${GITHUB_REPOSITORY}/actions/workflows/${workflow}/runs?branch=master&event=push&head_sha=${GITHUB_SHA}&status=success" --jq '.total_count')"
            if [[ "${count}" -lt 1 ]]; then
              echo "No successful ${workflow} push run exists for ${GITHUB_SHA}." >&2
              exit 1
            fi
          done
      - name: Refuse an existing release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            echo "Release ${GITHUB_REF_NAME} already exists; release identities are immutable." >&2
            exit 1
          fi

  publish-images:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: backend
            dockerfile: infra/docker/backend.Dockerfile
          - image: runtime
            dockerfile: infra/docker/runtime.Dockerfile
          - image: frontend
            dockerfile: infra/docker/frontend.Dockerfile
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Define immutable image identity
        shell: bash
        run: |
          image_name="ghcr.io/${GITHUB_REPOSITORY,,}/${{ matrix.image }}"
          printf 'IMAGE_NAME=%s\nIMAGE=%s:%s\n' "${image_name}" "${image_name}" "${GITHUB_REF_NAME}" >> "${GITHUB_ENV}"
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Refuse a mutable or reused image tag
        shell: bash
        run: |
          if docker manifest inspect "${IMAGE}" >/dev/null 2>&1; then
            echo "Container tag ${IMAGE} already exists and will not be overwritten." >&2
            exit 1
          fi
      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          load: true
          push: false
          tags: ${{ env.IMAGE }}
          build-args: |
            VERSION=${{ needs.verify.outputs.version }}
            VCS_REF=${{ github.sha }}
            SOURCE_URL=https://github.com/${{ github.repository }}
      - name: Scan the candidate image before publication
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}
          version: v0.74.0
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
      - name: Create image SBOM
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          image: ${{ env.IMAGE }}
          format: spdx-json
          output-file: ${{ matrix.image }}.spdx.json
          upload-artifact: false
          upload-release-assets: false
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Push and sign the immutable image digest
        id: publish
        shell: bash
        run: |
          push_output="$(docker push "${IMAGE}" 2>&1)"
          printf '%s\n' "${push_output}"
          digest="$(printf '%s\n' "${push_output}" | sed -nE 's/^.*digest: (sha256:[0-9a-f]{64}).*$/\1/p' | tail -n 1)"
          [[ "${digest}" =~ ^sha256:[0-9a-f]{64}$ ]]
          digest_ref="${IMAGE_NAME}@${digest}"
          docker manifest inspect "${digest_ref}" >/dev/null
          cosign sign --yes "${digest_ref}"
          cosign verify \
            --certificate-identity "https://github.com/${GITHUB_REPOSITORY}/.github/workflows/release.yml@refs/tags/${GITHUB_REF_NAME}" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            "${digest_ref}" >/dev/null
          printf 'digest=%s\ndigest-ref=%s\n' "${digest}" "${digest_ref}" >> "${GITHUB_OUTPUT}"
      - name: Attach build provenance to the image digest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.publish.outputs.digest }}
          push-to-registry: true
          create-storage-record: false
      - name: Attach the SBOM to the image digest
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.publish.outputs.digest }}
          subject-version: ${{ needs.verify.outputs.version }}
          sbom-path: ${{ matrix.image }}.spdx.json
          push-to-registry: true
          create-storage-record: false
      - name: Record release evidence and checksums
        shell: bash
        run: |
          printf 'version=%s\ntag=%s\nimage=%s\ndigest=%s\nsource=%s\nworkflow=%s\ncosign=verified\nprovenance=oci-referrer\nsbom_attestation=oci-referrer\n' \
            "${{ needs.verify.outputs.version }}" \
            "${GITHUB_REF_NAME}" \
            "${IMAGE}" \
            "${{ steps.publish.outputs.digest-ref }}" \
            "${GITHUB_SHA}" \
            "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
            > "${{ matrix.image }}.release.txt"
          sha256sum "${{ matrix.image }}.spdx.json" "${{ matrix.image }}.release.txt" > "${{ matrix.image }}.sha256"
          sha256sum --check "${{ matrix.image }}.sha256"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-${{ matrix.image }}
          path: |
            ${{ matrix.image }}.spdx.json
            ${{ matrix.image }}.release.txt
            ${{ matrix.image }}.sha256
          if-no-files-found: error
          retention-days: 30

  github-release:
    needs: [verify, publish-images]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: release-*
          path: release-assets
          merge-multiple: true
      - name: Create the exact source archive
        shell: bash
        run: |
          git archive \
            --format=tar.gz \
            --prefix="MCPlica-${{ needs.verify.outputs.version }}/" \
            --output="release-assets/mcplica-${GITHUB_REF_NAME}.tar.gz" \
            "${GITHUB_SHA}"
      - name: Create source SBOM
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          path: .
          format: spdx-json
          output-file: release-assets/source.spdx.json
          upload-artifact: false
          upload-release-assets: false
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Checksum and sign every downloadable release asset
        shell: bash
        run: |
          checksum_file="${RUNNER_TEMP}/mcplica-SHA256SUMS"
          (
            cd release-assets
            find . -maxdepth 1 -type f ! -name SHA256SUMS -printf '%f\0' \
              | sort -z \
              | xargs -0 sha256sum > "${checksum_file}"
            mv "${checksum_file}" SHA256SUMS
            sha256sum --check SHA256SUMS
          )
          cosign sign-blob --yes \
            --bundle release-assets/SHA256SUMS.bundle.json \
            release-assets/SHA256SUMS
          cosign verify-blob \
            --bundle release-assets/SHA256SUMS.bundle.json \
            --certificate-identity "https://github.com/${GITHUB_REPOSITORY}/.github/workflows/release.yml@refs/tags/${GITHUB_REF_NAME}" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            release-assets/SHA256SUMS
      - name: Publish the immutable GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          prerelease=()
          if [[ "${GITHUB_REF_NAME}" == *-* ]]; then prerelease+=(--prerelease); fi
          gh release create "${GITHUB_REF_NAME}" \
            --verify-tag \
            --title "MCPlica ${GITHUB_REF_NAME}" \
            --notes-file "docs/releases/${GITHUB_REF_NAME}.md" \
            "${prerelease[@]}"
          gh release upload "${GITHUB_REF_NAME}" release-assets/*
