[project]
name = "mcplica-backend"
version = "1.0.0"
description = "MCPlica builder/control plane"
requires-python = ">=3.13,<3.14"
dependencies = [
  "alembic>=1.16,<2",
  "beautifulsoup4>=4.13,<5",
  "cryptography>=50.0.1,<51",
  "docker>=7.1,<8",
  "email-validator>=2.2,<3",
  "fastapi>=0.116,<1",
  "httpx>=0.28,<1",
  "httpx2>=2.12,<3",
  "jsonschema>=4.25,<5",
  "markdown-it-py>=4,<5",
  "mcp==2.0.0",
  "openpyxl>=3.1.5,<4",
  "openapi-spec-validator>=0.7.2,<1",
  "packaging>=26,<27",
  "prometheus-client>=0.22,<1",
  "psycopg[binary,pool]>=3.2,<4",
  "pwdlib[argon2]>=0.2,<1",
  "PyJWT>=2.10,<3",
  "PyMuPDF>=1.26,<2",
  "pydantic>=2.11,<3",
  "pydantic-settings>=2.10,<3",
  "pymilvus==3.0.1",
  "python-multipart>=0.0.20,<1",
  "python-docx>=1.2,<2",
  "pyyaml>=6.0.2,<7",
  "redis>=6,<7",
  "rq>=2.4,<3",
  "sqlalchemy>=2.0.41,<3",
  "structlog>=25.4,<26",
  "uvicorn[standard]>=0.35,<1",
  "mcplica-contracts",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.4,<9",
  "pytest-asyncio>=1.1,<2",
  "pytest-cov>=6.2,<7",
  "pyright>=1.1.400,<2",
  "respx>=0.22,<1",
  "ruff>=0.12,<1",
]

[tool.uv.sources]
mcplica-contracts = { workspace = true }

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
markers = [
  "docker_integration: opt-in acceptance against a real Docker daemon and runtime image",
  "postgres_integration: opt-in transactional acceptance against a disposable PostgreSQL database",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.isort]
known-first-party = ["app", "scripts"]
