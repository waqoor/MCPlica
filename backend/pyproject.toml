[project]
name = "mcplica-backend"
version = "0.1.0"
description = "MCPlica builder/control plane"
requires-python = ">=3.13,<3.14"
dependencies = [
  "alembic>=1.16,<2",
  "asyncpg>=0.30,<1",
  "cryptography>=45,<46",
  "docker>=7.1,<8",
  "fastapi>=0.116,<1",
  "httpx>=0.28,<1",
  "jsonschema>=4.25,<5",
  "mcp==2.0.0",
  "pydantic>=2.11,<3",
  "pydantic-settings>=2.10,<3",
  "pymilvus==3.0.1",
  "python-multipart>=0.0.20,<1",
  "pyyaml>=6.0.2,<7",
  "redis>=6,<7",
  "rq>=2.4,<3",
  "sqlalchemy>=2.0.41,<3",
  "uvicorn[standard]>=0.35,<1",
  "mcplica-contracts",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.4,<9",
  "pytest-asyncio>=1.1,<2",
  "pytest-cov>=6.2,<7",
  "pyright>=1.1.400,<2",
  "ruff>=0.12,<1",
]

[tool.uv.sources]
mcplica-contracts = { workspace = true }

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
