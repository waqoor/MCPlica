services:
  migrate:
    image: ${BACKEND_IMAGE:?Set BACKEND_IMAGE to an immutable release digest}
    pull_policy: always
    environment:
      ENV: production

  api:
    image: ${BACKEND_IMAGE:?Set BACKEND_IMAGE to an immutable release digest}
    build: !reset null
    pull_policy: always
    environment:
      ENV: production
      FRONTEND_ORIGIN: https://${UI_DOMAIN:?Set UI_DOMAIN}
      MCP_DOMAIN: ${MCP_DOMAIN:?Set MCP_DOMAIN}
      MCP_RUNTIME_IMAGE: ${MCP_RUNTIME_IMAGE:?Set MCP_RUNTIME_IMAGE to an immutable release digest}
      TRAEFIK_ENTRYPOINT: websecure
      TRAEFIK_TLS: "true"
      TRAEFIK_CERT_RESOLVER: letsencrypt
      RUNTIME_HOST_ROOT: ${RUNTIME_HOST_ROOT:?Set an absolute RUNTIME_HOST_ROOT}
    labels:
      traefik.http.routers.mcplica-api.rule: Host(`${API_DOMAIN:?Set API_DOMAIN}`)
      traefik.http.routers.mcplica-api.entrypoints: websecure
      traefik.http.routers.mcplica-api.tls: "true"
      traefik.http.routers.mcplica-api.tls.certresolver: letsencrypt

  builder-worker:
    image: ${BACKEND_IMAGE:?Set BACKEND_IMAGE to an immutable release digest}
    pull_policy: always
    environment:
      ENV: production
      MCP_DOMAIN: ${MCP_DOMAIN:?Set MCP_DOMAIN}
      MCP_RUNTIME_IMAGE: ${MCP_RUNTIME_IMAGE:?Set MCP_RUNTIME_IMAGE to an immutable release digest}

  runtime-validator:
    image: ${MCP_RUNTIME_IMAGE:?Set MCP_RUNTIME_IMAGE to an immutable release digest}
    build: !reset null
    pull_policy: always
    environment:
      MCP_RUNTIME_VERSION: ${MCP_RUNTIME_VERSION:?Set MCP_RUNTIME_VERSION}

  deployment-worker:
    image: ${BACKEND_IMAGE:?Set BACKEND_IMAGE to an immutable release digest}
    pull_policy: always
    environment:
      ENV: production
      MCP_DOMAIN: ${MCP_DOMAIN:?Set MCP_DOMAIN}
      MCP_RUNTIME_IMAGE: ${MCP_RUNTIME_IMAGE:?Set MCP_RUNTIME_IMAGE to an immutable release digest}
      TRAEFIK_ENTRYPOINT: websecure
      TRAEFIK_TLS: "true"
      TRAEFIK_CERT_RESOLVER: letsencrypt
      RUNTIME_HOST_ROOT: ${RUNTIME_HOST_ROOT:?Set an absolute RUNTIME_HOST_ROOT}

  frontend:
    image: ${FRONTEND_IMAGE:?Set FRONTEND_IMAGE to an immutable release digest}
    build: !reset null
    pull_policy: always
    labels:
      traefik.http.routers.mcplica-ui.rule: Host(`${UI_DOMAIN:?Set UI_DOMAIN}`)
      traefik.http.routers.mcplica-ui.entrypoints: websecure
      traefik.http.routers.mcplica-ui.tls: "true"
      traefik.http.routers.mcplica-ui.tls.certresolver: letsencrypt

  traefik:
    command:
      - --api.dashboard=false
      - --entrypoints.traefik.address=:8082
      - --entrypoints.web.address=:80
      - --entrypoints.web.http.redirections.entrypoint.to=websecure
      - --entrypoints.web.http.redirections.entrypoint.scheme=https
      - --entrypoints.websecure.address=:443
      - --providers.docker.endpoint=unix:///var/run/docker.sock
      - --providers.docker.exposedbydefault=false
      - --providers.docker.allowemptyservices=false
      - --providers.docker.network=mcplica-edge
      - --ping=true
      - --ping.entrypoint=traefik
      - --certificatesresolvers.letsencrypt.acme.email=${ACME_EMAIL:?Set ACME_EMAIL}
      - --certificatesresolvers.letsencrypt.acme.storage=/letsencrypt/acme.json
      - --certificatesresolvers.letsencrypt.acme.tlschallenge=true
      - --log.level=INFO
    ports:
      - "443:443"
    volumes:
      - letsencrypt-data:/letsencrypt

volumes:
  letsencrypt-data:
