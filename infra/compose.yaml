name: mcplica

services:
  postgres:
    image: postgres:18.6@sha256:1957b2ff3137e4ef7f3bc813e74fff50b1e1ffddc85c8b9d6f14ade972be8687
    environment:
      POSTGRES_DB: mcplica
      POSTGRES_USER: mcplica
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      # PostgreSQL 18 stores clusters below a version-specific subdirectory.
      # Mount the parent so upgrades and pg_upgrade --link stay within one volume.
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mcplica -d mcplica"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [builder]

  redis:
    image: redis:8.2-alpine@sha256:30abb90e62f14b737010746def3ba99cc79fe19dcdb3d37b41f21fc62e7da19d
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [builder]

  etcd:
    container_name: milvus-etcd
    image: quay.io/coreos/etcd:v3.5.25@sha256:52f17f7e56e4f7239f0320dbfcbcc24721163d7d78ae710b466af3254ccf6366
    environment:
      ETCD_AUTO_COMPACTION_MODE: revision
      ETCD_AUTO_COMPACTION_RETENTION: "1000"
      ETCD_QUOTA_BACKEND_BYTES: "4294967296"
      ETCD_SNAPSHOT_COUNT: "50000"
    volumes:
      - etcd-data:/etcd
    command: etcd -advertise-client-urls=http://etcd:2379 -listen-client-urls http://0.0.0.0:2379 --data-dir /etcd
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 30s
      timeout: 20s
      retries: 3
    networks: [builder]

  minio:
    container_name: milvus-minio
    image: minio/minio:RELEASE.2024-05-28T17-19-04Z@sha256:391d1d45fdbe79944cb6de9337b073864bb9ee38c4c24280bfb39572e925af08
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?Set MINIO_ROOT_USER in .env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD in .env}
    volumes:
      - minio-data:/minio_data
    command: minio server /minio_data --console-address ":9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 30s
      timeout: 20s
      retries: 3
    networks: [builder]

  milvus:
    container_name: milvus-standalone
    image: milvusdb/milvus:v3.0.0@sha256:49371c30af46b1013e4d3e0b980e691d81376d69cdbe1b372725baf1d7255862
    command: ["milvus", "run", "standalone"]
    # Recover from transient standalone failures (for example, an etcd timeout)
    # without requiring an operator to notice and restart the container manually.
    restart: unless-stopped
    # Milvus probes the container cgroup limit when sizing internal resources.
    # Keep the default at its documented standalone minimum while allowing
    # operators to raise it for larger indexes.
    mem_limit: ${MILVUS_MEMORY_LIMIT:-8g}
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
      MINIO_ACCESS_KEY_ID: ${MINIO_ROOT_USER:?Set MINIO_ROOT_USER in .env}
      MINIO_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD in .env}
    volumes:
      - milvus-data:/var/lib/milvus
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:9091/healthz"]
      interval: 10s
      timeout: 5s
      start_period: 30s
      retries: 18
    depends_on:
      etcd:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks: [builder]

  migrate:
    image: ${BACKEND_IMAGE:-mcplica-api:local}
    env_file:
      - path: ../.env
        required: false
    command: ["alembic", "-c", "../migrations/alembic.ini", "upgrade", "head"]
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    networks: [builder]

  api:
    image: ${BACKEND_IMAGE:-mcplica-api:local}
    build:
      context: ..
      dockerfile: infra/docker/backend.Dockerfile
    env_file:
      - path: ../.env
        required: false
    environment:
      REDIS_URL: redis://redis:6379/0
      MILVUS_URI: http://milvus:19530
      ARTIFACT_ROOT: /data/artifacts
    volumes:
      - artifacts:/data/artifacts
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    read_only: true
    tmpfs:
      # Starlette spools multipart files to /tmp before the bounded source
      # storage layer reads them. Leave headroom above the 100 MB default so
      # valid boundary uploads reach application validation instead of ENOSPC.
      - /tmp:size=256m,mode=1777
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health', timeout=3).read()",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      milvus:
        condition: service_healthy
    networks: [builder, egress, edge]
    labels:
      traefik.enable: "true"
      traefik.http.routers.mcplica-api.rule: Host(`api.localhost`)
      traefik.http.routers.mcplica-api.entrypoints: web
      traefik.http.services.mcplica-api.loadbalancer.server.port: "8000"

  runtime-validator:
    image: ${MCP_RUNTIME_IMAGE:-mcplica-runtime:local}
    build:
      context: ..
      dockerfile: infra/docker/runtime.Dockerfile
      args:
        RUNTIME_VERSION: ${MCP_RUNTIME_VERSION:-1.0.0}
    command:
      [
        "python",
        "-m",
        "uvicorn",
        "app.validation_main:app",
        "--host",
        "0.0.0.0",
        "--port",
        "8090",
        "--workers",
        "1",
        "--no-server-header",
      ]
    environment:
      MCP_RUNTIME_VERSION: ${MCP_RUNTIME_VERSION:-1.0.0}
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8090/healthz', timeout=3).read()",
        ]
      interval: 10s
      timeout: 5s
      start_period: 10s
      retries: 12
    networks: [builder]

  builder-worker:
    image: ${BACKEND_IMAGE:-mcplica-api:local}
    env_file:
      - path: ../.env
        required: false
    environment:
      REDIS_URL: redis://redis:6379/0
      MILVUS_URI: http://milvus:19530
      ARTIFACT_ROOT: /data/artifacts
    command:
      [
        "rq",
        "worker",
        "--with-scheduler",
        "--url",
        "redis://redis:6379/0",
        "${BUILD_QUEUE_NAME:-mcplica-builds}",
      ]
    volumes:
      - artifacts:/data/artifacts
    read_only: true
    tmpfs:
      - /tmp:size=128m,mode=1777
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import os, socket; from redis import Redis; from rq import Worker;
          queue = os.getenv('BUILD_QUEUE_NAME', 'mcplica-builds');
          workers = Worker.all(connection=Redis.from_url('redis://redis:6379/0'));
          raise SystemExit(0 if any(worker.hostname == socket.gethostname() and
          queue in [item.name for item in worker.queues] for worker in workers) else 1)
      interval: 10s
      timeout: 5s
      start_period: 15s
      retries: 12
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      milvus:
        condition: service_healthy
      runtime-validator:
        condition: service_healthy
    networks: [builder, egress]

  runtime-init:
    image: ${BACKEND_IMAGE:-mcplica-api:local}
    user: "0:0"
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - >-
        chown ${RUNTIME_UID:-10001}:${RUNTIME_GID:-10001}
        ${RUNTIME_WORKER_ROOT:-/runtime-host} &&
        chmod 0700 ${RUNTIME_WORKER_ROOT:-/runtime-host}
    volumes:
      - type: bind
        source: ${RUNTIME_HOST_ROOT:?Set an absolute Docker host runtime path}
        target: ${RUNTIME_WORKER_ROOT:-/runtime-host}
    network_mode: none
    read_only: true
    cap_drop: [ALL]
    cap_add: [CHOWN, FOWNER]
    security_opt:
      - no-new-privileges:true
    restart: "no"

  deployment-worker:
    image: ${BACKEND_IMAGE:-mcplica-api:local}
    env_file:
      - path: ../.env
        required: false
    environment:
      REDIS_URL: redis://redis:6379/0
      ARTIFACT_ROOT: /data/artifacts
    command:
      [
        "rq",
        "worker",
        "--with-scheduler",
        "--url",
        "redis://redis:6379/0",
        "${DEPLOYMENT_QUEUE_NAME:-mcplica-deployments}",
      ]
    volumes:
      - artifacts:/data/artifacts
      # Docker socket belongs only on the deployment worker, not the public API container.
      - /var/run/docker.sock:/var/run/docker.sock
      # Write through a private worker path; Docker receives the daemon-visible source path.
      - type: bind
        source: ${RUNTIME_HOST_ROOT:?Set an absolute Docker host runtime path}
        target: ${RUNTIME_WORKER_ROOT:-/runtime-host}
    group_add:
      - "${DOCKER_GID:-0}"
    read_only: true
    tmpfs:
      - /tmp:size=128m,mode=1777
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import os, socket; from redis import Redis; from rq import Worker;
          queue = os.getenv('DEPLOYMENT_QUEUE_NAME', 'mcplica-deployments');
          workers = Worker.all(connection=Redis.from_url('redis://redis:6379/0'));
          raise SystemExit(0 if any(worker.hostname == socket.gethostname() and
          queue in [item.name for item in worker.queues] for worker in workers) else 1)
      interval: 10s
      timeout: 5s
      start_period: 15s
      retries: 12
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      runtime-init:
        condition: service_completed_successfully
    networks: [builder]

  frontend:
    build:
      context: ..
      dockerfile: infra/docker/frontend.Dockerfile
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-8080}:8080"
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--quiet",
          "--tries=1",
          "--spider",
          "http://127.0.0.1:8080/healthz",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
    depends_on:
      api:
        condition: service_healthy
    networks: [edge]
    labels:
      traefik.enable: "true"
      traefik.http.routers.mcplica-ui.rule: Host(`mcplica.localhost`)
      traefik.http.routers.mcplica-ui.entrypoints: web
      traefik.http.services.mcplica-ui.loadbalancer.server.port: "8080"

  traefik:
    image: traefik:v3.7.11@sha256:5203c3f39ca70de6790d964624e042463ffbd57715bc82be155cf224c0dd5144
    command: ["--configFile=/etc/traefik/traefik.yml"]
    ports:
      - "${EDGE_PORT:-80}:80"
      - "127.0.0.1:${EDGE_TLS_PORT:-8443}:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./traefik/traefik.yml:/etc/traefik/traefik.yml:ro
    healthcheck:
      test:
        [
          "CMD",
          "traefik",
          "healthcheck",
          "--ping",
          "--configFile=/etc/traefik/traefik.yml",
        ]
      interval: 10s
      timeout: 5s
      start_period: 10s
      retries: 12
    networks: [edge]
    labels:
      com.mcplica.edge: "true"

networks:
  builder:
    name: mcplica-builder
    internal: true
  egress:
    name: mcplica-egress
  edge:
    name: mcplica-edge

volumes:
  postgres-data:
  redis-data:
  etcd-data:
  minio-data:
  milvus-data:
  artifacts:
