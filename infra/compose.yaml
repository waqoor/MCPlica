name: mcplica

services:
  postgres:
    image: postgres:18.6
    environment:
      POSTGRES_DB: mcplica
      POSTGRES_USER: mcplica
      POSTGRES_PASSWORD: mcplica
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mcplica -d mcplica"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [builder]

  redis:
    image: redis:8.2-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [builder]

  etcd:
    container_name: milvus-etcd
    image: quay.io/coreos/etcd:v3.5.25
    environment:
      ETCD_AUTO_COMPACTION_MODE: revision
      ETCD_AUTO_COMPACTION_RETENTION: "1000"
      ETCD_QUOTA_BACKEND_BYTES: "4294967296"
      ETCD_SNAPSHOT_COUNT: "50000"
    volumes:
      - etcd-data:/etcd
    command: etcd -advertise-client-urls=http://etcd:2379 -listen-client-urls http://0.0.0.0:2379 --data-dir /etcd
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 30s
      timeout: 20s
      retries: 3
    networks: [builder]

  minio:
    container_name: milvus-minio
    image: minio/minio:RELEASE.2024-05-28T17-19-04Z
    environment:
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
    volumes:
      - minio-data:/minio_data
    command: minio server /minio_data --console-address ":9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 30s
      timeout: 20s
      retries: 3
    networks: [builder]

  milvus:
    container_name: milvus-standalone
    image: milvusdb/milvus:v3.0.0
    command: ["milvus", "run", "standalone"]
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
    volumes:
      - milvus-data:/var/lib/milvus
    ports:
      - "19530:19530"
      - "9091:9091"
    depends_on:
      etcd:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks: [builder]

  api:
    build:
      context: ..
      dockerfile: infra/docker/backend.Dockerfile
    env_file: ../.env
    environment:
      MCP_LICA_DATABASE_URL: postgresql+asyncpg://mcplica:mcplica@postgres:5432/mcplica
      MCP_LICA_REDIS_URL: redis://redis:6379/0
      MCP_LICA_MILVUS_URI: http://milvus:19530
      MCP_LICA_ARTIFACT_ROOT: /data/artifacts
    volumes:
      - artifacts:/data/artifacts
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      milvus:
        condition: service_started
    networks: [builder, egress, edge]
    labels:
      traefik.enable: "true"
      traefik.http.routers.mcplica-api.rule: Host(`api.localhost`)
      traefik.http.services.mcplica-api.loadbalancer.server.port: "8000"

  worker:
    build:
      context: ..
      dockerfile: infra/docker/backend.Dockerfile
    env_file: ../.env
    environment:
      MCP_LICA_DATABASE_URL: postgresql+asyncpg://mcplica:mcplica@postgres:5432/mcplica
      MCP_LICA_REDIS_URL: redis://redis:6379/0
      MCP_LICA_MILVUS_URI: http://milvus:19530
      MCP_LICA_ARTIFACT_ROOT: /data/artifacts
    command: ["rq", "worker", "--url", "redis://redis:6379/0", "mcplica"]
    volumes:
      - artifacts:/data/artifacts
      # Docker socket belongs only on the deployment worker, not the public API container.
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks: [builder, egress]

  frontend:
    build:
      context: ..
      dockerfile: infra/docker/frontend.Dockerfile
    ports:
      - "8080:80"
    depends_on: [api]
    networks: [edge]
    labels:
      traefik.enable: "true"
      traefik.http.routers.mcplica-ui.rule: Host(`mcplica.localhost`)
      traefik.http.services.mcplica-ui.loadbalancer.server.port: "80"

  traefik:
    image: traefik:v3.5
    command: ["--configFile=/etc/traefik/traefik.yml"]
    ports:
      - "80:80"
      - "8081:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./traefik/traefik.yml:/etc/traefik/traefik.yml:ro
    networks: [edge]

networks:
  builder:
    name: mcplica-builder
    internal: true
  egress:
    name: mcplica-egress
  edge:
    name: mcplica-edge

volumes:
  postgres-data:
  redis-data:
  etcd-data:
  minio-data:
  milvus-data:
  artifacts:
