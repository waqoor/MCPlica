[project]
name = "mcplica-runtime"
version = "0.1.0"
description = "Manifest-driven generic MCP runtime for MCPlica"
requires-python = ">=3.13,<3.14"
dependencies = [
  "httpcore>=1.0.9,<2",
  "httpx>=0.28,<1",
  "jsonschema>=4.25,<5",
  "mcp==2.0.0",
  "packaging>=26,<27",
  "pydantic>=2.11,<3",
  "pydantic-settings>=2.10,<3",
  "PyJWT[crypto]>=2.10,<3",
  "starlette>=1.6,<2",
  "uvicorn[standard]>=0.35,<1",
  "mcplica-contracts",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.4,<9",
  "pytest-asyncio>=1.1,<2",
  "pyright>=1.1.400,<2",
  "ruff>=0.12,<1",
]

[tool.uv.sources]
mcplica-contracts = { workspace = true }

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.isort]
known-first-party = ["app"]
