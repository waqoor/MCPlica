[project]
name = "mcplica-workspace"
version = "1.0.0"
requires-python = ">=3.13,<3.14"

[tool.uv.workspace]
members = ["backend", "mcp_runtime", "packages/contracts"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.isort]
known-first-party = ["app", "scripts"]

[tool.pyright]
pythonVersion = "3.13"
typeCheckingMode = "strict"
reportMissingTypeStubs = false

[tool.pytest.ini_options]
addopts = "-q"
asyncio_mode = "auto"
